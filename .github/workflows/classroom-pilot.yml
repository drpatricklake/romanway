name: Classroom pilot checks
on:
  pull_request:
  push:
    branches: [main, public-practice]
permissions:
  contents: read
jobs:
  classroom:
    name: Test classroom app and shared permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: developer/tests/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install server identity dependencies
        run: npm ci --ignore-scripts
      - name: Test keyless Google identity adapter
        run: node developer/tests/google-identity.test.mjs
      - name: Verify reproducible application build
        run: |
          python developer/build.py
          git diff --exit-code -- index.html
      - run: npm ci --ignore-scripts
        working-directory: developer/tests
      - run: npm test
        working-directory: developer/tests
      - name: Install Chromium for presentation checks
        run: npx playwright install --with-deps chromium
        working-directory: developer/tests
      - name: Browser interaction and mobile Circus presentation
        run: npm run test:browser
        working-directory: developer/tests

