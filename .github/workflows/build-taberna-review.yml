name: Build Taberna review
on:
  push:
    branches: [fix/lesson-xi-taberna-rotation]
    paths: ['.github/workflows/build-taberna-review.yml']
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/fix/lesson-xi-taberna-rotation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Rebuild and test
        run: |
          python3 developer/build.py
          test "$(git hash-object index.html)" = "fab8bddb16fb4c05101eb6dc403805d688b62d5c"
          python3 scripts/verify-assets.py --deployment .
          node developer/tests/bibliotheca-options.test.mjs index.html
          node developer/tests/lesson-checklist.test.mjs index.html
          node developer/tests/public-practice.test.mjs index.html
          node scripts/build-public-practice.mjs
          python3 scripts/verify-assets.py --deployment .vercel/output/static
      - name: Save generated review page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Regenerate the upright Taberna figure"
          git push origin HEAD:${GITHUB_REF}
