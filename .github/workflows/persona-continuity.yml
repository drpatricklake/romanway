name: Apply persona continuity
on:
  push:
    branches: [fix/restore-graphical-assets, fix/restore-forum-assets]
    paths: ['.github/workflows/persona-continuity.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  continuity:
    if: github.ref == 'refs/heads/fix/restore-graphical-assets' || github.ref == 'refs/heads/fix/restore-forum-assets'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply checked transformations and verify assets
        run: |
          python3 developer/apply-persona-continuity.py
          python3 scripts/verify-assets.py --deployment .
          if [ -f scripts/build-public-practice.mjs ]; then
            node scripts/build-public-practice.mjs
            python3 scripts/verify-assets.py --deployment .vercel/output/static
          fi
      - name: Commit generated application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use one stable fitted persona across all views and phases"
          git push origin HEAD:${GITHUB_REF}
