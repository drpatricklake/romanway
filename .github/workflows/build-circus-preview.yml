name: Prepare Circus preview
on:
  push:
    branches: [circus-chariots-dolphins]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: python developer/build.py
      - name: Save compiled presentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Build Circus chariots and dolphin markers"
          git push origin HEAD:circus-chariots-dolphins
