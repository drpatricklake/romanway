name: Rebuild Forum homepage review artifact
on:
  push:
    branches: [feat/forum-homepage]
    paths: [.github/workflows/build-forum-home-review.yml]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Rebuild and verify the Forum homepage
        run: |
          python3 developer/build.py
          test "$(git hash-object index.html)" = "9122af819002a3244723ac36292ec44eadfbb758"
          node developer/tests/forum-home.test.mjs
          node developer/tests/tablinum-projects.test.mjs
          node developer/tests/lesson-checklist.test.mjs
      - name: Commit only the generated app to the review branch
        run: |
          test "$GITHUB_REF" = "refs/heads/feat/forum-homepage"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Rebuild the streamlined Forum onboarding"
          git push origin HEAD:refs/heads/feat/forum-homepage
