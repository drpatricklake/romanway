name: Build avatar review
on:
  push:
    branches: [fix/avatar-ankle-proportions]
    paths: ['.github/workflows/build-avatar-review.yml']
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/fix/avatar-ankle-proportions'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Rebuild and verify the approved Forum preview
        run: |
          python3 developer/build.py
          test "$(git hash-object index.html)" = "64d0a8a35e9bd583da0a5719e87e65f25b07afdf"
          node developer/tests/public-practice.test.mjs index.html
          node scripts/build-public-practice.mjs
          python3 scripts/verify-assets.py --deployment .vercel/output/static
      - name: Save the generated page to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate approved avatar review"
          git push origin HEAD:${GITHUB_REF}
