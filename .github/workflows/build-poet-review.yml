name: Build Poet head review
on:
  push:
    branches: [fix/poet-head-banding]
    paths: ['.github/workflows/build-poet-review.yml']
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/fix/poet-head-banding'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Rebuild and verify
        run: |
          python3 developer/build.py
          test "$(git hash-object index.html)" = "91a28861046069be6e3233f355a4078c13765526"
          node developer/tests/lesson-checklist.test.mjs
          node developer/tests/public-practice.test.mjs index.html
          node scripts/build-public-practice.mjs
          python3 scripts/verify-assets.py --deployment .vercel/output/static
      - name: Save generated review page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Regenerate smooth Poet head"
          git push origin HEAD:${GITHUB_REF}
