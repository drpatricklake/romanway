name: Build lesson checklist review
on:
  push:
    branches: [feat/lesson-checklist-rewards]
    paths: ['.github/workflows/build-lesson-review.yml']
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/feat/lesson-checklist-rewards'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Rebuild and test the Forum checklist
        run: |
          git show HEAD:index.html > "$RUNNER_TEMP/lesson-before.html"
          python3 developer/build.py
          test "$(git hash-object index.html)" = "1a30fbe7c4899883dbc24ac99973f9bdf0d2b335"
          git diff --check
          node developer/tests/lesson-checklist.test.mjs index.html "$RUNNER_TEMP/lesson-before.html"
          node developer/tests/public-practice.test.mjs index.html
          node scripts/build-public-practice.mjs
          python3 scripts/verify-assets.py --deployment .vercel/output/static
      - name: Save the generated page to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate lesson checklist and reward meter"
          git push origin HEAD:${GITHUB_REF}
