name: Build avatar label bundle
on:
  push:
    branches: [avatar-origin-english-labels]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: python developer/build.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Build origin-specific avatar labels'
          git push origin HEAD:avatar-origin-english-labels
