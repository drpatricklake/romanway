name: NLE audit recovery
on:
  push:
    branches: [audit-nle-accuracy]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: developer/tests/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
        working-directory: developer/tests
      - name: Rebuild reviewed application
        run: python developer/build.py
      - name: Export complete before and after catalogue
        working-directory: developer/tests
        run: node export-nle.mjs ../../index.html /tmp/nle-snapshot.json ../nle-corrections.json
      - name: Export editorial spreadsheet
        run: python developer/export-nle-review.py
      - name: NLE regressions
        working-directory: developer/tests
        run: npm run test:nle
      - name: Core data and word-form regressions
        working-directory: developer/tests
        run: node core.test.mjs
      - name: Authentication regressions
        working-directory: developer/tests
        run: timeout -s INT 45s node --trace-sigint auth.test.mjs ../../index.html ../../firebase-auth.js
      - name: Classroom UI and 601 lesson tabs
        timeout-minutes: 5
        working-directory: developer/tests
        run: node ui.test.mjs ../../index.html ./fixtures/baseline-index.html
      - name: Circus UI regressions
        working-directory: developer/tests
        run: node race-ui.test.mjs ../../index.html
      - name: Atrium and Arena UI regressions
        working-directory: developer/tests
        run: node social-ui.test.mjs ../../index.html
      - name: Firestore permissions and classroom regressions
        timeout-minutes: 5
        working-directory: developer/tests
        run: ./node_modules/.bin/firebase emulators:exec --config ../../firebase.json --project demo-romanway --only firestore "node rules.test.mjs && node data.test.mjs && node classroom.test.mjs && node social.test.mjs"
      - name: Check deterministic rebuild
        run: |
          cp index.html /tmp/nle-built-index.html
          python developer/build.py
          cmp index.html /tmp/nle-built-index.html
      - name: Save tested application and editorial exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html developer/nle-corrections.json developer/NLE-CORRECTIONS.csv
          git diff --cached --quiet || git commit -m "Build audited NLE questions and export reviewed corrections"
          git push origin HEAD:audit-nle-accuracy
