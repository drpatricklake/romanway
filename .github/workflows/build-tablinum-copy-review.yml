name: Build updated Tablinum review
on:
  push:
    branches: [fix/tablinum-project-navigation]
    paths: ['.github/workflows/build-tablinum-copy-review.yml']
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/fix/tablinum-project-navigation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Rebuild and test
        run: |
          python3 developer/build.py
          test "$(git hash-object index.html)" = "5ad8a46d3d834bacf526909d23b34ee0a201f115"
          node developer/tests/tablinum-projects.test.mjs
          node developer/tests/lesson-checklist.test.mjs index.html
          node developer/tests/bibliotheca-options.test.mjs
          node developer/tests/public-practice.test.mjs index.html
          python3 scripts/verify-assets.py --deployment .
          node scripts/build-public-practice.mjs
          python3 scripts/verify-assets.py --deployment .vercel/output/static
      - name: Save generated review page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Regenerate lesson and Tablinum copy"
          git push origin HEAD:${GITHUB_REF}
