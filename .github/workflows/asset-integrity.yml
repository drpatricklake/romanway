name: RomanWay asset integrity
on:
  pull_request:
  push:
    branches: [main, public-practice, fix/restore-graphical-assets]
permissions:
  contents: read
jobs:
  asset-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify release assets and classroom static tree (fail closed)
        run: python3 scripts/verify-assets.py --deployment .
      - name: Verify actual Forum output when present
        run: |
          if [ -f scripts/build-public-practice.mjs ]; then
            node scripts/build-public-practice.mjs
            python3 scripts/verify-assets.py --deployment .vercel/output/static
          fi
