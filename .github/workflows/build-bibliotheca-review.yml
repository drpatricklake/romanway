name: Build Bibliotheca review
on:
  push:
    branches: [feat/bibliotheca-reading-options]
    paths: ['.github/workflows/build-bibliotheca-review.yml']
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/feat/bibliotheca-reading-options'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Rebuild and test
        run: |
          git show HEAD:index.html > "$RUNNER_TEMP/lesson-before.html"
          python3 developer/build.py
          test "$(git hash-object index.html)" = "167d87e21d02b1f24ad8a673dcb6f80c83cc6300"
          node developer/tests/bibliotheca-options.test.mjs
          node developer/tests/lesson-checklist.test.mjs index.html "$RUNNER_TEMP/lesson-before.html"
          node developer/tests/public-practice.test.mjs index.html
          node scripts/build-public-practice.mjs
          python3 scripts/verify-assets.py --deployment .vercel/output/static
      - name: Save generated review page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Regenerate Bibliotheca reading options"
          git push origin HEAD:${GITHUB_REF}
