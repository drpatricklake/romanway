name: RomanWay one-time asset import
on:
  push:
    branches: [fix/restore-graphical-assets]
    paths: ['.github/workflows/import-recovered-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: romanway-recovered-assets-import
  cancel-in-progress: false
jobs:
  import-assets:
    if: github.ref == 'refs/heads/fix/restore-graphical-assets'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconstruct and authenticate original archive
        shell: bash
        run: |
          set -euo pipefail
          test -f romanway-import-part-1.bin
          test -f romanway-import-part-2.bin
          cat romanway-import-part-1.bin romanway-import-part-2.bin > "$RUNNER_TEMP/romanway-complete-assets.zip"
          echo "fb8bab0d3d60576d1b2b03c57dec376e3d8999734cc959ba0d45db941858706f  $RUNNER_TEMP/romanway-complete-assets.zip" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/romanway-complete-assets.zip"
          unzip -q "$RUNNER_TEMP/romanway-complete-assets.zip" -d "$RUNNER_TEMP/romanway-import"
      - name: Install and verify recovered collection
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/romanway-import/romanway-asset-import/install-assets.py" "$GITHUB_WORKSPACE"
          python3 scripts/verify-assets.py --deployment .
          if [ -f scripts/build-public-practice.mjs ]; then
            node scripts/build-public-practice.mjs
            python3 scripts/verify-assets.py --deployment .vercel/output/static
          fi
          # The authenticated bundle's workflow is equivalent to the existing gate.
          # Keep workflow edits out of the automated binary commit.
          git restore -- .github/workflows/asset-integrity.yml
      - name: Commit only verified assets and integration changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets scripts/verify-assets.py scripts/apply-assets.py index.html developer/build.py
          if [ -f scripts/build-public-practice.mjs ]; then git add -- scripts/build-public-practice.mjs; fi
          git rm -- romanway-import-part-1.bin romanway-import-part-2.bin
          git diff --cached --stat
          git commit -m "Restore verified RomanWay artwork, textbook figures and worksheet PDFs"
          git push origin HEAD:refs/heads/fix/restore-graphical-assets
