name: Atrium review - generate updated screen
on:
  push:
    branches:
      - atrium-rewards-revision2-review
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-screen:
    if: github.ref == 'refs/heads/atrium-rewards-revision2-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact-once Atrium screen changes
        run: |
          if grep -q 'function serverSettle(h)' index.html; then
            echo 'Atrium screen already updated.'
          else
            python3 developer/apply-atrium-rewards.py
          fi
          git diff --check
      - name: Commit generated screen on review branch only
        run: |
          git add index.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(atrium): generate server-ledger screen'
            git push origin HEAD:atrium-rewards-revision2-review
          fi
